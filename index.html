<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trendy Buddy – Gadgets & Toys</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#FF5C00;--primary-dark:#D94D00;--accent:#FFB800;
  --bg:#F5F3EF;--card:#fff;--text:#18181B;--muted:#71717A;
  --border:#E4E4E7;--green:#16A34A;--green-bg:#F0FDF4;
  --badge-hot:#FF3B5C;--badge-new:#7C3AED;--badge-sale:#0891B2;
  --nav:#18181B;--radius:14px;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

nav{background:var(--nav);position:sticky;top:0;z-index:100;height:60px;padding:0 2rem;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 1px 0 rgba(255,255,255,.06)}
.logo{display:flex;align-items:center}
.logo-img{height:50px;width:auto;object-fit:contain}
.logo em{color:var(--accent);font-style:normal}
.cart-btn{background:var(--primary);color:#fff;border:none;border-radius:8px;
  padding:.45rem 1rem;font-family:'DM Sans',sans-serif;font-weight:600;font-size:.9rem;
  cursor:pointer;display:flex;align-items:center;gap:.5rem;position:relative}
.cart-btn:hover{background:var(--primary-dark)}
.cart-count{background:var(--accent);color:#18181B;font-size:.65rem;font-weight:800;
  border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;
  position:absolute;top:-6px;right:-6px}

.hero{background:var(--nav);padding:2.5rem 2rem 2rem;text-align:center}
.hero h1{font-family:'Syne',sans-serif;font-size:2.2rem;font-weight:800;color:#fff;margin-bottom:.4rem;letter-spacing:-1px}
.hero h1 em{color:var(--accent);font-style:normal}
.hero p{color:#A1A1AA;font-size:.95rem;margin-bottom:1.4rem}
.search-wrap{max-width:440px;margin:0 auto;position:relative}
.search-wrap input{width:100%;border:none;outline:none;padding:.7rem 1rem .7rem 2.8rem;
  font-family:'DM Sans',sans-serif;font-size:.95rem;border-radius:10px;background:#fff;color:var(--text)}
.si{position:absolute;left:.9rem;top:50%;transform:translateY(-50%);font-size:1rem;pointer-events:none;color:var(--muted)}

.filters{display:flex;gap:.5rem;flex-wrap:wrap;padding:1.2rem 2rem 0;justify-content:center}
.filter-btn{background:var(--card);border:1.5px solid var(--border);color:var(--muted);
  padding:.35rem .9rem;border-radius:8px;font-family:'DM Sans',sans-serif;font-weight:600;font-size:.85rem;cursor:pointer}
.filter-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.filter-btn:not(.active):hover{border-color:var(--primary);color:var(--primary)}

.section-title{font-family:'Syne',sans-serif;font-size:1.2rem;font-weight:700;
  color:var(--text);padding:1.4rem 2rem .6rem;display:flex;align-items:center;gap:.5rem}
.count-badge{background:var(--border);color:var(--muted);font-size:.75rem;
  font-family:'DM Sans',sans-serif;font-weight:600;padding:2px 8px;border-radius:99px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1rem;padding:0 2rem 3rem}

.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column}
.card:hover{box-shadow:0 4px 20px rgba(0,0,0,.08)}
.card-img-wrap{position:relative;background:#F4F4F5;height:185px;overflow:hidden}
.card-img-wrap img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:8px;left:8px;font-size:.65rem;font-weight:700;
  padding:3px 8px;border-radius:6px;text-transform:uppercase;color:#fff;letter-spacing:.3px}
.badge-hot{background:var(--badge-hot)}.badge-new{background:var(--badge-new)}.badge-sale{background:var(--badge-sale)}
.disc-badge{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;
  font-size:.65rem;font-weight:700;padding:3px 7px;border-radius:6px}
.card-body{padding:.85rem .9rem .9rem;flex:1;display:flex;flex-direction:column;gap:.3rem}
.card-cat{font-size:.72rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.card-name{font-weight:600;font-size:.9rem;color:var(--text);line-height:1.35}
.stars{font-size:.78rem;color:var(--accent);letter-spacing:1px}
.price-row{display:flex;align-items:baseline;gap:.4rem;margin-top:.1rem}
.card-price{font-family:'Syne',sans-serif;font-size:1.15rem;color:var(--primary);font-weight:800}
.old-price{font-size:.78rem;color:var(--muted);text-decoration:line-through}

/* ADD BUTTON */
.add-btn{margin-top:.7rem;width:100%;padding:.5rem;border:none;border-radius:8px;
  background:var(--primary);color:#fff;font-family:'DM Sans',sans-serif;font-weight:600;font-size:.88rem;cursor:pointer}
.add-btn:hover:not(.in-cart){background:var(--primary-dark)}
.add-btn.in-cart{background:var(--green-bg);color:var(--green);
  border:1.5px solid #86efac;cursor:default;font-weight:700;pointer-events:none}

/* QTY CONTROLS ON CARD */
.qty-row{display:none;align-items:center;justify-content:center;gap:.6rem;margin-top:.5rem}
.qty-row.show{display:flex}
.qty-btn{background:var(--bg);border:1px solid var(--border);color:var(--text);
  width:28px;height:28px;border-radius:6px;font-size:1rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-weight:700}
.qty-btn:hover{background:var(--border)}
.qty-num{font-size:.9rem;font-weight:700;min-width:24px;text-align:center}

/* CART PANEL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200}
.overlay.open{display:flex;justify-content:flex-end}
.cart-panel{background:#fff;width:360px;max-width:100vw;height:100vh;
  overflow-y:auto;display:flex;flex-direction:column;box-shadow:-2px 0 20px rgba(0,0,0,.12)}
.cart-header{padding:1.1rem 1.2rem;background:var(--nav);color:#fff;
  display:flex;align-items:center;justify-content:space-between;
  font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:700;position:sticky;top:0;z-index:1}
.close-btn{background:none;border:none;color:#A1A1AA;font-size:1.3rem;cursor:pointer;line-height:1}
.close-btn:hover{color:#fff}
.cart-items{flex:1;padding:.8rem;display:flex;flex-direction:column;gap:.6rem}
.cart-item{display:flex;gap:.7rem;align-items:center;border:1px solid var(--border);border-radius:10px;padding:.6rem}
.cart-item img{width:56px;height:56px;object-fit:cover;border-radius:8px;background:#F4F4F5;flex-shrink:0}
.cart-item-info{flex:1;min-width:0}
.cart-item-name{font-weight:600;font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cart-item-meta{font-size:.75rem;color:var(--muted)}
.cart-item-price{color:var(--primary);font-weight:700;font-size:.88rem}
.ci-qty{display:flex;align-items:center;gap:.4rem;margin-top:.3rem}
.ci-btn{background:var(--bg);border:1px solid var(--border);color:var(--text);
  width:22px;height:22px;border-radius:5px;font-size:.9rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-weight:700}
.ci-btn:hover{background:var(--border)}
.ci-num{font-size:.82rem;font-weight:600;min-width:18px;text-align:center}
.rm-btn{background:none;border:none;color:#D4D4D8;font-size:1.1rem;cursor:pointer;padding:.2rem;flex-shrink:0}
.rm-btn:hover{color:var(--badge-hot)}
.cart-footer{padding:1rem 1.2rem;border-top:1px solid var(--border);background:#fff;position:sticky;bottom:0}
.cart-summary{background:var(--bg);border-radius:10px;padding:.8rem;margin-bottom:.9rem}
.sum-row{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-bottom:.3rem}
.sum-row.total{color:var(--text);font-weight:700;font-size:1rem;border-top:1px solid var(--border);padding-top:.4rem;margin-top:.3rem;margin-bottom:0}
.wa-btn{width:100%;padding:.75rem;border:none;border-radius:10px;
  background:#25D366;color:#fff;font-family:'DM Sans',sans-serif;font-weight:700;font-size:.95rem;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.5rem}
.wa-btn:hover{background:#1aaa52}
.empty-cart{text-align:center;padding:3rem 1rem;color:var(--muted)}
.empty-icon{font-size:2.5rem;margin-bottom:.6rem}

.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);
  background:#18181B;color:#fff;padding:.55rem 1.2rem;border-radius:8px;
  font-size:.83rem;font-weight:600;z-index:999;opacity:0;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.no-results{grid-column:1/-1;text-align:center;padding:3rem;color:var(--muted);font-size:.95rem}

footer{background:var(--nav);color:#52525B;text-align:center;padding:1.2rem;font-size:.82rem}
footer span{color:var(--accent)}

@media(max-width:640px){
  nav{padding:0 1rem}
  .hero{padding:2rem 1rem 1.5rem}
  .hero h1{font-size:1.7rem}
  .filters{padding:1rem 1rem 0}
  .section-title{padding:1.2rem 1rem .5rem}
  .grid{padding:0 1rem 2rem;gap:.8rem;grid-template-columns:repeat(auto-fill,minmax(155px,1fr))}
  .cart-panel{width:100vw}
  .card-img-wrap{height:150px}
}
</style>

  {id:49, name:'Programmable Robot Kit',      cat:'Robots',        price:2999,old:3999,tag:'NEW', stars:5,img:'https://images.unsplash.com/photo-1485827404703-89b55fcc595e?w=500&q=80'},
  {id:50, name:'Smart Robot Dog Toy',         cat:'Robots',        price:1899,old:2499,tag:'HOT', stars:4,img:'https://images.unsplash.com/photo-1555255707-c07966088b7b?w=500&q=80'},
  {id:51, name:'STEM Robot Arm Kit',          cat:'Robots',        price:3499,old:4499,tag:'NEW', stars:5,img:'https://images.unsplash.com/photo-1561557944-6e7860d1a7eb?w=500&q=80'},
  {id:52, name:'Line Follower Robot',         cat:'Robots',        price:1299,old:1799,tag:'SALE',stars:4,img:'https://images.unsplash.com/photo-1581092921461-eab62e97a780?w=500&q=80'},
  {id:53, name:'AI Voice Robot Companion',    cat:'Robots',        price:4999,old:6499,tag:'HOT', stars:5,img:'https://images.unsplash.com/photo-1531746790731-6c087fecd65a?w=500&q=80'},
  {id:54, name:'Solar Powered Robot Kit',     cat:'Robots',        price:999, old:1399,tag:'SALE',stars:4,img:'https://images.unsplash.com/photo-1620712943543-bcc4688e7485?w=500&q=80'},
  {id:55, name:'Humanoid Dancing Robot',      cat:'Robots',        price:2299,old:2999,tag:'NEW', stars:4,img:'https://images.unsplash.com/photo-1518314916381-77a37c2a49ae?w=500&q=80'},
  {id:56, name:'Mini 6-Leg Spider Robot',     cat:'Robots',        price:1799,old:2499,tag:'HOT', stars:5,img:'https://images.unsplash.com/photo-1518770660439-4636190af475?w=500&q=80'},
];

const categories = ['All',...new Set(products.map(p=>p.cat))];
let cart = [];
let activeFilter = 'All';
let searchQuery = '';

const catIcons = {All:'🔥','Remote Toys':'🚗',Drones:'🛸',Gadgets:'⚡','Smart Devices':'📱',Gaming:'🎮',Robots:'🤖'};

// ── helpers ──────────────────────────────────────────────────
const inCart   = id => cart.some(x=>x.id===id);
const qtyOf    = id => { const i=cart.find(x=>x.id===id); return i?i.qty:0; };
const starsStr = n  => '★'.repeat(n)+'☆'.repeat(5-n);
const disc     = (p,o) => Math.round((1-p/o)*100);
const tagCls   = t  => t==='HOT'?'badge-hot':t==='NEW'?'badge-new':'badge-sale';

// ── filters ──────────────────────────────────────────────────
function buildFilters(){
  document.getElementById('filterRow').innerHTML = categories.map((c,i)=>
    `<button class="filter-btn${i===0?' active':''}" onclick="setFilter('${c}',this)">${c}</button>`
  ).join('');
}

function setFilter(f,el){
  activeFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  const icon=catIcons[f]||'📦';
  document.getElementById('sectionTitle').innerHTML=
    `${icon} ${f==='All'?'All Products':f} <span class="count-badge" id="productCount">0</span>`;
  renderProducts();
}

function filterProducts(){
  searchQuery=document.getElementById('searchInput').value;
  renderProducts();
}

// ── render ───────────────────────────────────────────────────
function renderProducts(){
  const filtered=products.filter(p=>{
    const mc=activeFilter==='All'||p.cat===activeFilter;
    const q=searchQuery.toLowerCase();
    const ms=!q||p.name.toLowerCase().includes(q)||p.cat.toLowerCase().includes(q);
    return mc&&ms;
  });

  const el=document.getElementById('productCount');
  if(el) el.textContent=filtered.length;

  const grid=document.getElementById('productGrid');
  if(!filtered.length){
    grid.innerHTML='<div class="no-results">😕 No products found.</div>';
    return;
  }

  grid.innerHTML=filtered.map(p=>{
    const added=inCart(p.id);
    const qty=qtyOf(p.id);
    return `
    <div class="card">
      <div class="card-img-wrap">
        <img src="${p.img}" alt="${p.name}" loading="lazy"
          onerror="this.src='https://images.unsplash.com/photo-1498049794561-7780e7231661?w=400&q=80'">
        <span class="badge ${tagCls(p.tag)}">${p.tag}</span>
        <span class="disc-badge">-${disc(p.price,p.old)}%</span>
      </div>
      <div class="card-body">
        <div class="card-cat">${p.cat}</div>
        <div class="card-name">${p.name}</div>
        <div class="stars">${starsStr(p.stars)}</div>
        <div class="price-row">
          <span class="card-price">₹${p.price.toLocaleString('en-IN')}</span>
          <span class="old-price">₹${p.old.toLocaleString('en-IN')}</span>
        </div>
        <button class="add-btn${added?' in-cart':''}" id="btn-${p.id}"
          onclick="addToCart(${p.id})"${added?' disabled':''}>
          ${added?'✓ Added to Cart':'+ Add to Cart'}
        </button>
        <div class="qty-row${added?' show':''}" id="qty-${p.id}">
          <button class="qty-btn" onclick="changeQty(${p.id},-1)">−</button>
          <span class="qty-num" id="qn-${p.id}">${qty}</span>
          <button class="qty-btn" onclick="changeQty(${p.id},1)">+</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── cart actions ─────────────────────────────────────────────
function addToCart(id){
  if(inCart(id)) return;
  const p=products.find(x=>x.id===id);
  cart.push({...p,qty:1});
  updateCartCount();

  // permanently set button to added state
  const btn=document.getElementById('btn-'+id);
  const qRow=document.getElementById('qty-'+id);
  const qn=document.getElementById('qn-'+id);
  if(btn){btn.classList.add('in-cart');btn.textContent='✓ Added to Cart';btn.disabled=true;}
  if(qRow) qRow.classList.add('show');
  if(qn) qn.textContent=1;

  showToast(p.name+' added to cart');
}

function changeQty(id,delta){
  const item=cart.find(x=>x.id===id);
  if(!item) return;
  item.qty+=delta;

  if(item.qty<=0){
    cart=cart.filter(x=>x.id!==id);
    // reset card button
    const btn=document.getElementById('btn-'+id);
    const qRow=document.getElementById('qty-'+id);
    if(btn){btn.classList.remove('in-cart');btn.textContent='+ Add to Cart';btn.disabled=false;}
    if(qRow) qRow.classList.remove('show');
  } else {
    const qn=document.getElementById('qn-'+id);
    if(qn) qn.textContent=item.qty;
    // sync cart panel qty label if open
    const ci=document.getElementById('ci-'+id);
    if(ci) ci.textContent=item.qty;
  }
  updateCartCount();
  if(document.getElementById('cartOverlay').classList.contains('open')) renderCart();
}

function removeFromCart(id){
  cart=cart.filter(x=>x.id!==id);
  const btn=document.getElementById('btn-'+id);
  const qRow=document.getElementById('qty-'+id);
  const qn=document.getElementById('qn-'+id);
  if(btn){btn.classList.remove('in-cart');btn.textContent='+ Add to Cart';btn.disabled=false;}
  if(qRow) qRow.classList.remove('show');
  if(qn) qn.textContent=0;
  updateCartCount();
  renderCart();
}

function updateCartCount(){
  document.getElementById('cartCount').textContent=cart.reduce((s,x)=>s+x.qty,0);
}

// ── cart panel ───────────────────────────────────────────────
function openCart(){
  document.getElementById('cartOverlay').classList.add('open');
  renderCart();
}
function closeCart(){document.getElementById('cartOverlay').classList.remove('open');}
function bgClose(e){if(e.target===document.getElementById('cartOverlay'))closeCart();}

function renderCart(){
  const itemsEl=document.getElementById('cartItems');
  const footerEl=document.getElementById('cartFooter');
  if(!cart.length){
    itemsEl.innerHTML='<div class="empty-cart"><div class="empty-icon">🛒</div><p>Cart is empty!<br>Add some cool gadgets.</p></div>';
    footerEl.style.display='none';
    return;
  }
  itemsEl.innerHTML=cart.map(p=>`
    <div class="cart-item">
      <img src="${p.img}" alt="${p.name}"
        onerror="this.src='https://images.unsplash.com/photo-1498049794561-7780e7231661?w=200&q=80'">
      <div class="cart-item-info">
        <div class="cart-item-name">${p.name}</div>
        <div class="cart-item-meta">${p.cat}</div>
        <div class="cart-item-price">₹${(p.price*p.qty).toLocaleString('en-IN')}</div>
        <div class="ci-qty">
          <button class="ci-btn" onclick="changeQty(${p.id},-1)">−</button>
          <span class="ci-num" id="ci-${p.id}">${p.qty}</span>
          <button class="ci-btn" onclick="changeQty(${p.id},1)">+</button>
        </div>
      </div>
      <button class="rm-btn" onclick="removeFromCart(${p.id})">✕</button>
    </div>
  `).join('');

  const total=cart.reduce((s,x)=>s+x.price*x.qty,0);
  document.getElementById('subtotalVal').textContent='₹'+total.toLocaleString('en-IN');
  document.getElementById('totalVal').textContent='₹'+total.toLocaleString('en-IN');
  footerEl.style.display='block';
}

// ── whatsapp ─────────────────────────────────────────────────
function sendWA(){
  if(!cart.length) return;
  const total=cart.reduce((s,x)=>s+x.price*x.qty,0);
  let msg='🛍️ *New Order – TrendyBuddy*\n\n';
  cart.forEach(p=>{
    msg+=`▸ *${p.name}*\n  ${p.cat} | Qty: ${p.qty} | ₹${(p.price*p.qty).toLocaleString('en-IN')}\n\n`;
  });
  msg+=`━━━━━━━━━━━━━━\n💰 *Total: ₹${total.toLocaleString('en-IN')}*\n\nPlease confirm my order! 🙏`;
  window.open('https://wa.me/'+PHONE+'?text='+encodeURIComponent(msg),'_blank');
}

// ── toast ────────────────────────────────────────────────────
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t);
  t._t=setTimeout(()=>t.classList.remove('show'),2200);
}

// ── init ─────────────────────────────────────────────────────
buildFilters();
renderProducts();
</script>
</body>
</html>
